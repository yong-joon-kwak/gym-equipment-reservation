# 커밋·푸시 가드. 배치의 근거는 docs/BUILD-PLAN.md §6.
#
# skip 조건은 아직 존재하지 않는 대상을 건너뛰기 위한 것이고, 그 대상이 생기면
# 스스로 풀린다. phpunit 은 필터(--group)가 하나도 못 맞추면 실패로 끝나므로,
# 첫 테스트 파일이 생기기 전까지만 건너뛴다.

pre-commit:
  parallel: true
  jobs:
    - name: stan
      run: composer -d apps/backend run stan

    - name: phpunit-fast
      run: composer -d apps/backend run test:fast
      skip:
        - run: test -z "$(find apps/backend/tests -name '*Test.php' -print -quit)"

    - name: typecheck
      run: npm run typecheck
      skip:
        - run: test ! -f apps/frontend/package.json

    - name: vitest
      run: npm run test:front
      skip:
        - run: test ! -f apps/frontend/package.json

pre-push:
  parallel: true
  jobs:
    - name: stan
      run: composer -d apps/backend run stan

    - name: phpunit-all
      run: composer -d apps/backend run test
      skip:
        - run: test -z "$(find apps/backend/tests -name '*Test.php' -print -quit)"

    - name: typecheck
      run: npm run typecheck
      skip:
        - run: test ! -f apps/frontend/package.json

    - name: vitest
      run: npm run test:front
      skip:
        - run: test ! -f apps/frontend/package.json
